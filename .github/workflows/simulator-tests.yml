name: XyrisOS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  simulator-tests:
    name: Build and Test XyrisSim
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc

      - name: Run simulator test suite
        run: |
          ./scripts/simulator-test.sh

      - name: Check for whitespace errors
        run: |
          git diff --check

  kernel-build:
    name: Build XyrisOS Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc

      - name: Build kernel
        run: |
          ./scripts/build.sh

      - name: Check for whitespace errors
        run: |
          git diff --check
